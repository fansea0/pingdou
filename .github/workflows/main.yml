name: build_ping_dou

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "server/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".env"
      - ".env.*"
      - "scripts/**"
      - ".github/workflows/main.yml"

jobs:
  deploy:
    name: 部署拼豆项目
    runs-on: ubuntu-latest

    steps:
      - name: 安装 SSH 工具
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      # 线上拓扑（2026-10-09 起）：
      #   nginx (systemd: nginx)   443 直接托管 /var/www/pingdou 的静态产物
      #                            /api/ 反代 127.0.0.1:3000
      #   systemd: pingdou-backend Express API，监听 3000
      #   systemd: certbot-renew.timer 证书自动续期
      #
      # 不再有「前端 5173 跑 vite preview」这回事 —— 那套 nohup 进程/pid 文件
      # 的管理方式已被 systemd 取代。这里只负责「拉代码 + 调部署脚本」。
      - name: 部署到服务器
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: root
          PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -p "$PASSWORD" ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            "$USER@$HOST" 'bash -s' << 'EOF'

          set -euo pipefail

          PROJECT_DIR="/root/project/pingdou"
          cd "$PROJECT_DIR"

          echo "=============================="
          echo "开始部署拼豆项目"
          echo "=============================="

          echo "拉取最新代码..."
          git fetch origin main
          # 服务器上不应有本地改动；.env / data / node_modules / dist 都在
          # .gitignore 里，git reset 不会碰到它们
          git reset --hard origin/main
          git log --oneline -1

          # 构建 + 发布静态文件 + 重启 systemd 后端 + 重载 nginx + 健康检查
          # 全部逻辑收在脚本里，本地和 CI 走同一条路径
          bash "$PROJECT_DIR/scripts/deploy-server.sh"

          echo "=============================="
          echo "部署完成：https://xn--muu023g.xyz"
          echo "=============================="

          EOF
